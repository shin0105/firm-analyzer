name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build wheel
        run: uv build --wheel

      - name: Verify the wheel imports as `firm_analyzer`
        run: |
          uv run --no-project --with dist/*.whl python -c "
          import firm_analyzer.config as c
          print('BASE_DIR resolves to:', c.BASE_DIR)
          "

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must never be committed."
            exit 1
          fi
          echo "No tracked .env — good."

      - name: Scan for credential-shaped literals
        run: |
          # Tavily, GitHub, JWTs (Supabase keys), OpenAI/Anthropic, Google, Supabase secret keys, AWS
          if git grep -nE 'tvly-[A-Za-z0-9-]{10}|gh[pous]_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|eyJhbGciOi[A-Za-z0-9]|(^|[^A-Za-z0-9])sk-(ant-)?[A-Za-z0-9_-]{20}|AIza[0-9A-Za-z_-]{30}|sb_secret_[A-Za-z0-9_-]{10}|AKIA[0-9A-Z]{16}' \
               -- ':!uv.lock' ':!*package-lock.json' ':!frontend/dist' ':!.github'; then
            echo "::error::Possible credential committed to the repository."
            exit 1
          fi
          echo "No credential-shaped literals found."

      - name: Fail if generated results are tracked
        run: |
          # AI-written text about real companies and scraped pages stay local.
          if [ -n "$(git ls-files firm_results config.yml frontend/static-site)" ]; then
            echo "::error::firm_results/, frontend/static-site/ or config.yml is tracked. Remove it with git rm --cached."
            exit 1
          fi
          echo "No generated results tracked."
