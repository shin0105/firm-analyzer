<body>
    <div class="container">
        <header>
            <h1>2025 전문연구요원 인원배정 현황</h1>
            <p class="subtitle">전문연구요원 편입 가능 업체 지도</p>
        </header>

        <div class="tabs-container">
            <div class="tabs" id="regionTabs">
                <button class="tab active" data-region="all">전체</button>
                <button class="tab" data-region="서울">서울</button>
                <button class="tab" data-region="부산">부산</button>
                <button class="tab" data-region="대전">대전</button>
                <button class="tab" data-region="대구">대구</button>
                <button class="tab" data-region="인천">인천</button>
                <button class="tab" data-region="광주">광주</button>
                <button class="tab" data-region="울산">울산</button>
                <button class="tab" data-region="경기">경기</button>
                <button class="tab" data-region="세종">세종</button>
            </div>
        </div>

        <!-- Seoul district filter -->
        <div class="district-filter" id="districtFilter" style="display: none;">
            <label for="seoulDistrict">서울 구 선택:</label>
            <select id="seoulDistrict">
                <option value="all">전체</option>
            </select>
        </div>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
            </div>
            <div class="firm-list-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="업체명 또는 주소 검색...">
                </div>
                <div class="firm-count">
                    <span id="firmCount">0</span>개 업체
                </div>
                <div class="firm-list" id="firmList">
                    <div class="loading">데이터 로딩 중...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load scripts with integrity check fallback -->
    <script>
        // Fallback if CDN fails - inline minimal Leaflet functionality placeholder
        window.L = window.L || null;
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            onerror="console.log('Leaflet CDN failed, map will be disabled')"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"
            onerror="console.log('PapaParse CDN failed')"></script>
    <script src="firm_viewer.js"></script>
</body>
</html>
