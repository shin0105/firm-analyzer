[project]
name = "firm-websearch"
version = "0.1.0"
description = "A configurable web-based tool for filtering, searching, and summarizing firm/company information"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "shin0105" }
]
dependencies = [
    "flask>=3.0.3",
    "pandas>=2.3.1",
    "requests>=2.32.4",
    "python-dotenv>=1.1.1",
    "tavily-python>=0.7.10",
    "openai>=2.8.1",
    "pdfplumber>=0.11.8",
    "httpx>=0.28.1",
    "tiktoken>=0.9.0",
    "flask-cors>=4.0.0",
    # One SDK per selectable LLM provider. All three are imported lazily, so a
    # missing package only breaks the provider that needs it.
    "anthropic>=0.116.0",
    "google-genai>=1.0.0",
    "pypdf>=5.0.0",
    "supabase>=2.12.0",
    "pyyaml>=6.0.1",
    "geopy>=2.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
firm-app = "firm_analyzer.web.app:main"
firm-filter = "firm_analyzer.core.filter:main"
firm-roster = "firm_analyzer.core.roster:main"
firm-summarize = "firm_analyzer.core.summarize:main"
firm-segment = "firm_analyzer.core.resegment:main"
firm-export = "firm_analyzer.core.export:main"
firm-geocode = "firm_analyzer.core.geocoding:main"
firm-parse-pdf = "firm_analyzer.core.pdf_parser_rule:main"
firm-parse-pdf-llm = "firm_analyzer.core.pdf_parser_llm:main"
firm-supabase-sync = "firm_analyzer.core.supabase_sync:main"
firm-find-webpage = "firm_analyzer.utils.webpage_finder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firm_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
