<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문연구요원 인원배정 업체 지도</title>
    <link rel="icon" type="image/png" href="{{ url_for(static_endpoint|default('static'), filename='favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="{{ url_for(static_endpoint|default('static'), filename='css/firms_viewer.css') }}">
    <script>
        // Inside the app (?embed=1) the page header is the app's own, so this
        // page drops its header and frame. Set before first paint: no flash.
        if (new URLSearchParams(location.search).get('embed') === '1') {
            document.documentElement.classList.add('embed');
        }
    </script>
</head>
<body{% if not enable_kakao_map %} class="no-map"{% endif %}>
    <div class="viewer">
        <header class="viewer-header">
            <h1>전문연구요원 인원배정 업체 지도</h1>
            <p>출처: 병무청 전문연구요원 인원배정 현황 · 위치는 주소로 추정한 근사값입니다</p>
        </header>

        <div class="toolbar">
            <div id="region-chips" class="region-chips" role="group" aria-label="지역 선택"></div>
            <div id="gu-filter" class="gu-filter" hidden>
                <label for="gu-select">서울 구</label>
                <select id="gu-select">
                    <option value="all">전체</option>
                </select>
            </div>
        </div>

        <div class="viewer-body">
            <div id="map" class="map" aria-label="업체 위치 지도"></div>
            <aside class="panel" aria-label="업체 목록">
                <div class="panel-head">
                    <div class="panel-stats" aria-live="polite">
                        <span><strong id="filtered-count">0</strong> / <span id="total-count">0</span>개 기관</span>
                        <span id="source-note" class="source-note"></span>
                    </div>
                    <input type="search" id="search-input" placeholder="기관명 또는 주소 검색" aria-label="기관명 또는 주소 검색">
                </div>
                <ul id="firms-list" class="firms-list"></ul>
            </aside>
        </div>
    </div>

    {% if enable_kakao_map %}
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&libraries=clusterer&autoload=false"></script>
    {% endif %}
    <script>
        window.ENABLE_KAKAO_MAP = {{ 'true' if enable_kakao_map else 'false' }};
    </script>
    <script src="{{ url_for(static_endpoint|default('static'), filename='js/firms_data.js') }}"></script>
    <script src="{{ url_for(static_endpoint|default('static'), filename='js/firms_viewer.js') }}"></script>
</body>
</html>
