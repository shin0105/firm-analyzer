<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="전문연구요원 배정 업체를 지도와 AI 요약으로 찾아보는 도구" />
    <script>
      // Light by default; a saved choice, or the system's dark mode, wins.
      // Set before first paint so the page never flashes the other theme.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('firm-analyzer-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#181c21' : '#ffffff';
      })();
    </script>
    <title>Firm Analyzer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 애플리케이션을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
