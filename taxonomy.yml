# Firm segmentation taxonomy
#
# Five independent axes, deliberately not one flat list of categories:
#
#   sectors        what the firm mainly DOES        (single label, 2 levels)
#   verticals      which technologies it BUILDS ON  (multi-label, orthogonal)
#   business_models how it MAKES MONEY              (single label)
#   value_chain    where it SITS in the chain       (single label)
#   profile        organisation shape and R&D role  (fixed enums)
#
# Why axes instead of a longer category list: a fabless AI-chip startup is
# "semiconductor" on the sector axis, "AI/ML" and "chip design" on the vertical
# axis, "component supplier" on the value chain, and "hardware product" as a
# business model. A single flat taxonomy forces those four facts to compete for
# one slot, which is what makes a flat list feel wrong for roughly a third of
# firms. Standard taxonomies split the same way: KSIC/NAICS classify by
# principal activity, while Crunchbase and PitchBook keep technology
# "verticals" separate from sector precisely because they cross-cut it.
#
# `distinguish` entries are the tie-break rules that get injected into the
# classification prompt. They exist because the hard cases are almost never
# "which sector is this" but "which of these two adjacent sectors", and the
# answer is usually a revenue-model question rather than a topical one.
#
# Edit freely: ids are the contract (they end up in CSVs and Supabase rows),
# labels and keywords are free text.

