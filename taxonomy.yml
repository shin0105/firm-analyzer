    keywords: [해석, CFD, FEM, 시뮬레이션, 디지털트윈해석]
  - id: precision_control
    name: 정밀계측·제어
    keywords: [계측, 센싱, 정밀제어, 캘리브레이션]
  - id: none
    name: 해당 없음
    keywords: []

vertical_rules:
  - 최대 3개까지만 부여한다. 근거 문장을 댈 수 없는 태그는 붙이지 않는다.
  - 기술을 "사용"하는 것과 "개발·판매"하는 것을 구분한다. 태그는 후자에만 부여한다.
  - 섹터와 중복되어도 무방하다(예: 팹리스 기업 = sector semiconductor_hardware + vertical chip_design).

# ---------------------------------------------------------------------------
# Axis 3 — Business model (how revenue is earned)
# ---------------------------------------------------------------------------
business_models:
  - id: b2b_saas
    name: B2B SaaS·구독
    signal: 동일 제품을 다수 기업 고객에 구독·라이선스로 반복 판매
  - id: b2b_solution
    name: B2B 솔루션·엔터프라이즈 구축
    signal: 라이선스 + 구축·커스터마이징이 결합된 대형 계약
  - id: b2c_service
    name: B2C 서비스·앱
    signal: 개인 이용자에게 직접 과금하거나 광고로 수익화
  - id: marketplace_platform
    name: 플랫폼·중개
    signal: 제3자 간 거래를 중개하고 수수료를 수취
  - id: hardware_product
    name: 완제품 하드웨어 판매
    signal: 자사 브랜드 완제품을 제조·판매
  - id: component_supplier
    name: 부품·소재 공급
    signal: 다른 제조사의 생산 공정에 투입되는 부품·소재를 납품
  - id: oem_odm
    name: OEM·ODM·수탁제조
    signal: 고객 설계·브랜드로 위탁 생산
  - id: rnd_service
    name: 연구·시험 용역(CRO/CDMO/분석)
    signal: 고객 과제 단위로 연구·시험·분석을 수탁
  - id: si_consulting
    name: SI·컨설팅·인력공급
    signal: 프로젝트 공수(man-month) 기준 청구
  - id: licensing_ip
    name: 기술이전·IP 라이선싱
    signal: 특허·설계자산·물질 권리 이전과 마일스톤·로열티
  - id: public_research
    name: 공공·비영리 연구
    signal: 출연금·국가과제가 주 재원
  - id: unknown
    name: 판단 불가
    signal: 수익 모델을 알 수 있는 근거가 없음

business_model_rules:
  - 회사 소개 문구가 아니라 "누가 무엇에 대해 돈을 지불하는가"로 판단한다.
  - 제품 판매와 구축 용역을 함께 하면 매출 비중이 큰 쪽을 고른다. 비중을 알 수 없으면 b2b_solution 을 쓰고 confidence 를 낮춘다.

# ---------------------------------------------------------------------------
# Axis 4 — Position in the value chain
# ---------------------------------------------------------------------------
value_chain:
  - id: basic_research
    name: 원천·선행연구
  - id: materials
    name: 소재·원재료
  - id: parts
    name: 부품·디바이스 제조
  - id: module_equipment
    name: 모듈·장비 제조
  - id: finished_product
    name: 완제품 제조
  - id: system_integration
    name: 시스템 통합·구축
  - id: service_operation
    name: 서비스 운영
  - id: distribution
    name: 유통·판매
  - id: platform_intermediary
    name: 플랫폼 중개
  - id: unknown
    name: 판단 불가

# ---------------------------------------------------------------------------
# Axis 5 — Organisation profile (fixed enums, evidence-driven)
# ---------------------------------------------------------------------------
profile:
  size_tier:
    - {id: large, name: 대기업}
    - {id: mid, name: 중견기업}
    - {id: sme, name: 중소기업}
    - {id: startup, name: 스타트업}
    - {id: research_org, name: 연구기관}
    - {id: public, name: 공공기관}
    - {id: unknown, name: 불명}
  rnd_intensity:
    - {id: high, name: 높음, signal: 전담 연구조직·다수 특허·매출 대비 큰 R&D 지출}
    - {id: medium, name: 보통, signal: 연구개발 활동은 있으나 부서 규모가 작음}
    - {id: low, name: 낮음, signal: 운영·영업 중심, 연구 언급 거의 없음}
    - {id: unknown, name: 불명}
  # 전문연구요원 관점에서 실제로 어떤 일을 하게 되는지.
  research_role:
    - {id: basic_applied, name: 기초·선행연구}
    - {id: applied_dev, name: 응용개발}
    - {id: product_dev, name: 제품개발·양산기술}
    - {id: data_analytics, name: 데이터·분석}
    - {id: service_ops, name: 서비스 운영·지원}
    - {id: unknown, name: 불명}

# ---------------------------------------------------------------------------
# Global tie-break rules (injected verbatim into the prompt)
# ---------------------------------------------------------------------------
rules:
  - 주된 산업활동 기준(한국표준산업분류 원칙): 기업이 여러 활동을 겸업하면 부가가치가 가장 큰 활동으로 분류한다. 부가가치를 알 수 없으면 매출액, 그다음 종업원 수 순으로 판단한다.
  - 자기 소개보다 매출원을 우선한다. "AI 기반", "플랫폼", "종합 솔루션" 같은 홍보 문구는 근거로 쓰지 않는다.
  - 계열사·지주 구조에서는 이 업체명에 해당하는 사업 실체만 분류한다. 모회사의 사업을 끌어오지 않는다.
  - 근거가 없으면 추측하지 말고 unknown 또는 other 를 선택하고 confidence 를 low 로 둔다.
  - 모든 축의 라벨은 반드시 이 분류체계에 정의된 id 중에서 고른다. 새 id 를 만들지 않는다.
  - evidence 에는 검색 결과에서 실제로 확인한 근거를 한국어 한 문장으로 쓰고, 가능하면 출처 URL 을 함께 넣는다.

confidence_levels: [high, medium, low]
max_verticals: 3
